{% extends "base.html" %}
{% block content %}
<div class="topbar"><div><h1>New invoice</h1></div></div>
<div class="card tab" data-tab="NEW INVOICE" style="max-width:560px;">
  <form method="post">
    {% csrf_token %}
    <div class="field"><label>Patient</label>{{ form.patient }}</div>
    <div class="field"><label>Description</label>{{ form.description }}</div>
    <div class="field"><label>Amount ($)</label>{{ form.amount }}</div>
    <div class="field"><label>Status</label>{{ form.status }}</div>
    <div class="actions">
      <button class="btn primary" type="submit">Create Invoice</button>
      <a class="btn ghost" href="{% url 'invoice_list' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
