{% extends "base.html" %}
{% block content %}
<div class="topbar"><div><h1>Book appointment</h1></div></div>
<div class="card tab" data-tab="NEW APPOINTMENT" style="max-width:640px;">
  <form method="post">
    {% csrf_token %}
    <div class="field"><label>Patient</label>{{ form.patient }}</div>
    <div class="field"><label>Doctor</label>{{ form.doctor }}</div>
    <div class="field"><label>Reason</label>{{ form.reason }}</div>
    <div class="field"><label>Date &amp; time</label>{{ form.scheduled_at }}</div>
    <div class="field"><label>Status</label>{{ form.status }}</div>
    <div class="field"><label>Notes</label>{{ form.notes }}</div>
    <div class="actions">
      <button class="btn primary" type="submit">Book Appointment</button>
      <a class="btn ghost" href="{% url 'appointment_list' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
